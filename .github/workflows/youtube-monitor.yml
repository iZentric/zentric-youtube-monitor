name: YouTube monitor

on:
  schedule:
    # 06:00 UTC = 08:00 în România/Moldova când este UTC+2
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install public collector
        run: python -m pip install --quiet yt-dlp

      - name: Run public YouTube monitor
        run: python monitor.py

      - name: Commit snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          git diff --cached --quiet || git commit -m "Update YouTube monitor snapshot"
          git push
